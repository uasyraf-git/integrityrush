<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Integrity Rush 🏎️ — FGV Holdings Berhad</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #07071A; overflow-x: hidden; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    button { font-family: inherit; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    // ─── Config ───────────────────────────────────────────────────
    const CW = 370, CH = 580;
    const LANES = [92, 185, 278];
    const PY = CH - 108;
    const PW = 40, PH = 64;
    const OW = 40, OH = 62;
    const INIT_SPD = 4.5;
    const SPD_INC = 0.0005;
    const Q_EVERY = 650;

    const OBS = [
      { label: "RASUAH",         icon: "💰", color: "#FF4455" },
      { label: "KONFLIK",        icon: "⚖️", color: "#FF9900" },
      { label: "SALAH GUNA",     icon: "⚡", color: "#9944FF" },
      { label: "TUNTUTAN PALSU", icon: "📋", color: "#FF44BB" },
    ];

    const QS = [
      { q: "Vendor ajak makan malam mewah semasa proses bidaan. Apa buat?",
        opts: ["Pergi je, lapar!", "Tolak & lapor Integriti", "Pergi tapi simpan rahsia"],
        ok: 1, cat: "Anti-Rasuah", cc: "#FF5757" },
      { q: "Jumpa sampul berisi duit dalam laci meja. Tiada nota, tiada nama.",
        opts: ["Simpan dulu...", "Lapor Unit Integriti segera", "Buang je biar selamat"],
        ok: 1, cat: "Anti-Rasuah", cc: "#FF5757" },
      { q: "Rakan bisik: 'Kena jaga orang yang sign kalau nak projek lulus cepat.'",
        opts: ["Tanya berapa nak dijaga", "Pura-pura tak dengar", "Tegur & lapor Integriti"],
        ok: 2, cat: "Anti-Rasuah", cc: "#FF5757" },
      { q: "Adik korang bid kontrak FGV. Korang dalam panel penilaian tender tu.",
        opts: ["Teruskan — boleh adil", "Dedah & keluar dari panel", "Tolong adik menang"],
        ok: 1, cat: "Konflik Kepentingan", cc: "#FFB800" },
      { q: "Kena interview jiran baik sendiri untuk jawatan kosong di FGV.",
        opts: ["Interview je, kalau layak ambil", "Dedah & minta orang lain", "Reject terus"],
        ok: 1, cat: "Konflik Kepentingan", cc: "#FFB800" },
      { q: "Boss suruh guna kereta syarikat untuk hantar anak dia ke sekolah.",
        opts: ["Ikut je — boss yang suruh", "Tegur & lapor jika berterusan", "Buat tapi jangan rekod"],
        ok: 1, cat: "Salah Guna Kuasa", cc: "#A78BFA" },
      { q: "Ada akses sistem HR. Rakan minta tengok gaji orang lain 'sekadar nak tahu'.",
        opts: ["Tengok je, ada access pun", "Tolak — untuk kerja rasmi je", "Tengok tapi rahsia"],
        ok: 1, cat: "Salah Guna Kuasa", cc: "#A78BFA" },
      { q: "Naik ETS ke KL tapi tuntut kadar penerbangan dalam borang tuntutan.",
        opts: ["OK je, jimat masa syarikat", "Penipuan — boleh kena tindakan", "OK kalau boss luluskan"],
        ok: 1, cat: "Tuntutan Palsu", cc: "#34D399" },
      { q: "Rakan minta sign sebagai saksi OT. Tapi korang tahu dia tak kerja hari tu.",
        opts: ["Sign je, kawan baik", "Tolak & nasihat rakan", "Sign tapi tulis diari"],
        ok: 1, cat: "Tuntutan Palsu", cc: "#34D399" },
    ];

    // ─── Canvas helpers ───────────────────────────────────────────
    function rr(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
      ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
      ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
      ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
      ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
    }

    function drawCar(ctx, cx, cy, w, h, col, isPlayer, label, icon) {
      const x = cx-w/2, y = cy-h/2;
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = 20;
      ctx.fillStyle = col;
      rr(ctx,x,y,w,h,7); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = isPlayer ? "#003344" : "#00000030";
      ctx.fillRect(x+5,y+10,w-10,12); ctx.fillRect(x+5,y+28,w-10,11);
      ctx.fillStyle = isPlayer ? "#FFFFC0" : "#FF6666";
      ctx.fillRect(x+3,y+2,6,4); ctx.fillRect(x+w-9,y+2,6,4);
      ctx.textAlign = "center";
      if (isPlayer) {
        ctx.fillStyle="#fff"; ctx.font="bold 9px Arial"; ctx.fillText("FGV",cx,cy+4);
        ctx.font="13px serif"; ctx.fillText("🛡️",cx,cy+18);
      } else {
        ctx.font="24px serif"; ctx.fillText(icon,cx,cy+10);
        const pillTxt = label;
        ctx.font="bold 10px Arial";
        const tw = ctx.measureText(pillTxt).width;
        const pillW = tw+18, pillH = 22;
        const pillX = cx-pillW/2, pillY = y-pillH-5;
        ctx.save();
        ctx.shadowColor=col; ctx.shadowBlur=14;
        ctx.fillStyle=col;
        rr(ctx,pillX,pillY,pillW,pillH,11); ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle="#fff"; ctx.font="bold 10px Arial";
        ctx.fillText(pillTxt,cx,pillY+15);
        ctx.restore();
      }
      ctx.restore();
    }

    // ─── App ──────────────────────────────────────────────────────
    function App() {
      const canvasRef = useRef(null);
      const gRef      = useRef(null);
      const rafRef    = useRef(null);
      const scrRef    = useRef("menu");
      const hsRef     = useRef(0);

      const [screen, setScreen] = useState("menu");
      const [qState, setQState] = useState(null);
      const [hud, setHud]       = useState({ score:0, lives:3 });

      function initGame() {
        gRef.current = {
          px: LANES[1], lane: 1,
          spd: INIT_SPD, dist: 0, score: 0, coinCt: 0,
          lives: 3, shieldT: 0, shakeT: 0, rdOff: 0,
          obstacles: [], stars: [], ptcls: [],
          nextObs: 80, nextStar: 40, nextQ: Q_EVERY,
          qArr: [...QS].sort(()=>Math.random()-0.5),
          qIdx: 0, frame: 0,
        };
      }

      function moveLane(dir) {
        const g = gRef.current;
        if (!g || scrRef.current !== "playing") return;
        g.lane = Math.max(0, Math.min(2, g.lane+dir));
      }

      useEffect(()=>{
        const h=(e)=>{
          if(e.key==="ArrowLeft"||e.key==="a") moveLane(-1);
          if(e.key==="ArrowRight"||e.key==="d") moveLane(1);
        };
        window.addEventListener("keydown",h);
        return()=>window.removeEventListener("keydown",h);
      },[]);

      useEffect(()=>{
        if(screen!=="playing") return;
        const canvas = canvasRef.current;
        if(!canvas) return;
        const ctx = canvas.getContext("2d");

        function loop() {
          const g = gRef.current;
          if(!g) return;
          g.frame++;
          g.spd = Math.min(14, g.spd + SPD_INC);
          g.dist += g.spd * 0.1;
          g.rdOff = (g.rdOff + g.spd) % 80;
          g.score += g.spd * 0.04;
          if(g.shieldT>0) g.shieldT--;
          if(g.shakeT>0)  g.shakeT--;
          g.px += (LANES[g.lane] - g.px) * 0.17;

          if(g.dist >= g.nextObs){
            const lane = Math.floor(Math.random()*3);
            const t = OBS[Math.floor(Math.random()*OBS.length)];
            g.obstacles.push({...t, x:LANES[lane], y:-OH-5});
            g.nextObs = g.dist + 55 + Math.random()*80;
          }
          if(g.dist >= g.nextStar){
            const lane = Math.floor(Math.random()*3);
            g.stars.push({x:LANES[lane], y:-15, done:false});
            g.nextStar = g.dist + 32 + Math.random()*44;
          }

          g.obstacles.forEach(o=>o.y+=g.spd);
          g.obstacles = g.obstacles.filter(o=>o.y<CH+OH);
          g.stars.forEach(s=>s.y+=g.spd);
          g.stars = g.stars.filter(s=>s.y<CH+20);
          g.ptcls.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.38;p.a-=0.04;p.r-=0.12;});
          g.ptcls = g.ptcls.filter(p=>p.a>0&&p.r>0);

          for(const o of g.obstacles){
            if(Math.abs(o.y-PY)<PH*0.72 && Math.abs(o.x-g.px)<PW*0.65){
              if(g.shieldT<=0){
                g.lives--;
                g.shieldT=75; g.shakeT=18;
                for(let i=0;i<16;i++) g.ptcls.push({x:g.px,y:PY,vx:(Math.random()-.5)*8,vy:(Math.random()-1)*7,col:o.color,a:1,r:8});
              }
              o.y=CH+200;
              if(g.lives<=0){
                hsRef.current=Math.max(hsRef.current,Math.floor(g.score));
                setHud({score:Math.floor(g.score),lives:0});
                scrRef.current="gameover"; setScreen("gameover");
                cancelAnimationFrame(rafRef.current);
                return;
              }
              break;
            }
          }

          for(const s of g.stars){
            if(!s.done && Math.abs(s.y-PY)<28 && Math.abs(s.x-g.px)<25){
              s.done=true; g.coinCt++; g.score+=15;
              for(let i=0;i<8;i++) g.ptcls.push({x:s.x,y:s.y,vx:(Math.random()-.5)*4,vy:-Math.random()*5,col:"#FFD700",a:1,r:5});
            }
          }

          if(g.dist>=g.nextQ){
            g.nextQ = g.dist+Q_EVERY;
            const q = g.qArr[g.qIdx%g.qArr.length];
            g.qIdx++;
            scrRef.current="question";
            setQState({...q, selected:null, feedback:null});
            setHud({score:Math.floor(g.score),lives:g.lives});
            setScreen("question");
            cancelAnimationFrame(rafRef.current);
            return;
          }

          if(g.frame%8===0) setHud({score:Math.floor(g.score),lives:g.lives});

          // DRAW
          ctx.fillStyle="#08081C"; ctx.fillRect(0,0,CW,CH);
          ctx.fillStyle="#131330"; ctx.fillRect(46,0,CW-92,CH);

          [46,CW-46].forEach(lx=>{
            ctx.save(); ctx.shadowColor="#00FFCC"; ctx.shadowBlur=12;
            ctx.strokeStyle="#00FFCC50"; ctx.lineWidth=3;
            ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,CH); ctx.stroke();
            ctx.restore();
          });

          ctx.strokeStyle="#FFFFFF18"; ctx.lineWidth=2;
          ctx.setLineDash([36,44]); ctx.lineDashOffset=-g.rdOff;
          [139,CW-139].forEach(lx=>{ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,CH);ctx.stroke();});
          ctx.setLineDash([]);

          ctx.strokeStyle="#FFFFFF06"; ctx.lineWidth=1;
          [15,25,CW-25,CW-15].forEach(lx=>{
            const off=(g.rdOff*1.5)%60;
            for(let y=-60+off;y<CH+60;y+=60){
              ctx.beginPath(); ctx.moveTo(lx,y); ctx.lineTo(lx,y+30); ctx.stroke();
            }
          });

          g.stars.forEach(s=>{
            if(s.done) return;
            ctx.save(); ctx.shadowColor="#FFD700"; ctx.shadowBlur=18;
            ctx.font="26px serif"; ctx.textAlign="center";
            ctx.fillText("⭐",s.x,s.y+10);
            ctx.font="bold 9px Arial";
            const tw2=ctx.measureText("KUTIP!").width+14;
            ctx.fillStyle="#FFD700CC";
            rr(ctx,s.x-tw2/2,s.y+14,tw2,16,8); ctx.fill();
            ctx.fillStyle="#000"; ctx.fillText("KUTIP!",s.x,s.y+25);
            ctx.restore();
          });

          g.obstacles.forEach(o=>drawCar(ctx,o.x,o.y+OH/2,OW,OH,o.color,false,o.label,o.icon));

          ctx.save();
          if(g.shakeT>0){const s=(g.shakeT/18)*7;ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s);}
          const shielded=g.shieldT>0;
          if(shielded && g.frame%6<3){
            ctx.save(); ctx.shadowColor="#00FFFF"; ctx.shadowBlur=30;
            ctx.strokeStyle="#00FFFF"; ctx.lineWidth=2.5;
            ctx.beginPath(); ctx.ellipse(g.px,PY,PW*0.85,PH*0.6,0,0,Math.PI*2); ctx.stroke();
            ctx.restore();
          }
          drawCar(ctx,g.px,PY,PW,PH,shielded?"#00FFFF":"#00C8AA",true,"","");
          ctx.restore();

          g.ptcls.forEach(p=>{
            ctx.save(); ctx.globalAlpha=p.a; ctx.fillStyle=p.col;
            ctx.shadowColor=p.col; ctx.shadowBlur=8;
            ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0,p.r),0,Math.PI*2); ctx.fill();
            ctx.restore();
          });

          ctx.fillStyle="#FFFFFF"; ctx.font="bold 15px Arial"; ctx.textAlign="left";
          ctx.shadowColor="#00FFCC"; ctx.shadowBlur=8;
          ctx.fillText(`⭐ ${Math.floor(g.score)}`, 8, 26);
          ctx.shadowBlur=0;
          ctx.textAlign="right";
          ctx.fillText("❤️".repeat(g.lives)+"🖤".repeat(3-g.lives), CW-8, 26);

          ctx.save();
          ctx.font="bold 11px Arial"; ctx.textAlign="center";
          ctx.fillStyle="#FFD700CC"; ctx.fillText("⭐ KUTIP", CW/2-56, CH-10);
          ctx.fillStyle="#FFFFFF30"; ctx.fillText("|", CW/2, CH-10);
          ctx.fillStyle="#FF4455CC"; ctx.fillText("🚗 ELAK", CW/2+52, CH-10);
          ctx.restore();

          if(shielded){
            ctx.save(); ctx.shadowColor="#00FFFF"; ctx.shadowBlur=12;
            ctx.fillStyle="#00FFFFCC"; ctx.font="bold 11px Arial"; ctx.textAlign="center";
            ctx.fillText("🛡️ PERISAI AKTIF", CW/2, 50);
            ctx.restore();
          }

          rafRef.current = requestAnimationFrame(loop);
        }

        rafRef.current = requestAnimationFrame(loop);
        return()=>cancelAnimationFrame(rafRef.current);
      },[screen]);

      function handleAnswer(i) {
        const g = gRef.current;
        if(!g || qState.selected!==null) return;
        const correct = i===qState.ok;
        setQState(q=>({...q, selected:i, feedback:correct}));
        setTimeout(()=>{
          if(correct){ g.score+=200; g.shieldT=200; }
          else { g.lives=Math.max(0,g.lives-1); }
          if(g.lives<=0){
            hsRef.current=Math.max(hsRef.current,Math.floor(g.score));
            setHud({score:Math.floor(g.score),lives:0});
            scrRef.current="gameover"; setScreen("gameover");
            setQState(null); return;
          }
          setQState(null);
          scrRef.current="playing"; setScreen("playing");
        },2400);
      }

      function handleCanvasInput(clientX) {
        if(scrRef.current!=="playing") return;
        const canvas=canvasRef.current; if(!canvas) return;
        const rect=canvas.getBoundingClientRect();
        const gx=(clientX-rect.left)*(CW/rect.width);
        if(gx<CW/2) moveLane(-1); else moveLane(1);
      }

      function startGame() {
        initGame(); scrRef.current="playing";
        setHud({score:0,lives:3}); setScreen("playing");
      }

      const f="'Segoe UI',system-ui,sans-serif";

      // ── MENU ──────────────────────────────────────────────────
      if(screen==="menu") return(
        <div style={{background:"#07071A",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:f,color:"#fff",padding:"20px"}}>
          <div style={{textAlign:"center",marginBottom:6}}>
            <div style={{fontSize:64,lineHeight:1}}>🏎️</div>
            <div style={{fontSize:10,letterSpacing:6,color:"#00FFCC",marginTop:8,fontWeight:700}}>FGV HOLDINGS BERHAD</div>
          </div>
          <h1 style={{margin:"10px 0 4px",fontSize:34,fontWeight:900,background:"linear-gradient(90deg,#00FFCC,#0099FF,#AA44FF)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",letterSpacing:-1}}>
            INTEGRITY RUSH
          </h1>
          <p style={{color:"#FF4455",fontWeight:700,fontSize:12,letterSpacing:2,margin:"0 0 24px"}}>ELAK CORRUPTION. PANDU DENGAN INTEGRITI.</p>
          <p style={{color:"#3A5A7A",fontSize:14,textAlign:"center",maxWidth:290,lineHeight:1.85,margin:"0 0 24px"}}>
            Pandu kereta FGV merentasi highway integriti!<br/>
            🚗 Elak kenderaan <b style={{color:"#FF4455"}}>CORRUPTION</b><br/>
            ⭐ Kutip bintang integriti<br/>
            🛡️ Jawab soalan → dapat perisai!
          </p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:24,width:"100%",maxWidth:290}}>
            {OBS.map(o=>(
              <div key={o.label} style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${o.color}30`,borderRadius:10,padding:"8px 12px",display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:18}}>{o.icon}</span>
                <span style={{color:o.color,fontSize:11,fontWeight:700}}>{o.label}</span>
              </div>
            ))}
          </div>
          <div style={{background:"#0C112A",border:"1px solid #1A2545",borderRadius:14,padding:"12px 20px",marginBottom:28,width:"100%",maxWidth:290,fontSize:12,color:"#3A5A7A",lineHeight:2.1}}>
            <div>🕹️ <b style={{color:"#6A8ABB"}}>Ketik kiri/kanan</b> untuk tukar lorong</div>
            <div>⭐ Kutip bintang → <b style={{color:"#FFD700"}}>+15 mata</b></div>
            <div>✅ Jawab betul → <b style={{color:"#00D4AA"}}>+200 mata + Perisai 3s</b></div>
            <div>💥 Langgar / jawab salah → <b style={{color:"#FF5757"}}>-1 ❤️</b></div>
          </div>
          <button onClick={startGame} style={{background:"linear-gradient(135deg,#00D4AA,#0088FF)",border:"none",borderRadius:50,color:"#fff",fontWeight:900,fontSize:18,padding:"16px 56px",cursor:"pointer",boxShadow:"0 8px 30px rgba(0,180,150,0.5)",letterSpacing:1}}>
            PANDU! 🏎️
          </button>
          {hsRef.current>0 && <p style={{color:"#FFD700",fontSize:14,marginTop:16,fontWeight:700}}>🏆 Rekod Terbaik: {hsRef.current}</p>}
        </div>
      );

      // ── GAME OVER ─────────────────────────────────────────────
      if(screen==="gameover") return(
        <div style={{background:"#07071A",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:f,color:"#fff",padding:20}}>
          <div style={{fontSize:72,marginBottom:8}}>💥</div>
          <h2 style={{margin:0,fontSize:28,fontWeight:900,color:"#FF4455"}}>HABIS LAH!</h2>
          <p style={{color:"#3A5A7A",fontSize:14,margin:"8px 0 32px"}}>Korang kena langgar corruption... tapi sekarang dah lebih tahu!</p>
          <div style={{background:"#0C112A",border:"1px solid #1A2545",borderRadius:20,padding:"30px 52px",marginBottom:32,textAlign:"center"}}>
            <div style={{color:"#4A6A8A",fontSize:11,fontWeight:700,letterSpacing:2,marginBottom:8,textTransform:"uppercase"}}>Markah Akhir</div>
            <div style={{fontSize:56,fontWeight:900,color:"#FFD700",lineHeight:1}}>{hud.score}</div>
            {hsRef.current>0 && <div style={{color:"#3A5A7A",fontSize:13,marginTop:10}}>🏆 Rekod: <b style={{color:"#FFD700"}}>{hsRef.current}</b></div>}
          </div>
          <div style={{display:"flex",gap:12}}>
            <button onClick={startGame} style={{background:"linear-gradient(135deg,#00D4AA,#0088FF)",border:"none",borderRadius:50,color:"#fff",fontWeight:800,fontSize:15,padding:"14px 36px",cursor:"pointer",boxShadow:"0 6px 20px rgba(0,180,150,0.4)"}}>
              Cuba Lagi 🏎️
            </button>
            <button onClick={()=>{scrRef.current="menu";setScreen("menu");}} style={{background:"transparent",border:"1.5px solid #1A2545",borderRadius:50,color:"#3A5A7A",fontSize:14,fontWeight:600,padding:"14px 24px",cursor:"pointer"}}>
              Menu
            </button>
          </div>
        </div>
      );

      // ── PLAYING + QUESTION OVERLAY ─────────────────────────────
      return(
        <div style={{background:"#06061A",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-start",fontFamily:f,padding:"14px 0 20px"}}>
          <div style={{position:"relative",width:CW,maxWidth:"100%"}}>
            <canvas
              ref={canvasRef}
              width={CW} height={CH}
              style={{display:"block",width:"100%",borderRadius:14,touchAction:"none",cursor:"pointer",boxShadow:"0 0 50px rgba(0,180,150,0.12)"}}
              onClick={e=>handleCanvasInput(e.clientX)}
              onTouchStart={e=>{e.preventDefault();handleCanvasInput(e.touches[0].clientX);}}
            />
            {screen==="question" && qState && (
              <div style={{position:"absolute",inset:0,background:"rgba(4,4,20,0.95)",borderRadius:14,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"18px 16px"}}>
                <div style={{background:"linear-gradient(135deg,#FF9900,#FF4455)",borderRadius:50,padding:"8px 24px",marginBottom:14,fontSize:12,fontWeight:900,color:"#fff",letterSpacing:1,textTransform:"uppercase"}}>
                  ⚠️ SOALAN INTEGRITI ⚠️
                </div>
                <div style={{background:"#0D1528",border:`2px solid ${qState.cc}35`,borderRadius:14,padding:"16px",marginBottom:14,width:"100%"}}>
                  <div style={{color:qState.cc,fontSize:10,fontWeight:700,letterSpacing:2,marginBottom:8,textTransform:"uppercase"}}>{qState.cat}</div>
                  <p style={{color:"#C0D4EE",fontSize:14,lineHeight:1.8,margin:0}}>{qState.q}</p>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:9,width:"100%"}}>
                  {qState.opts.map((opt,i)=>{
                    let bg="#112030",bc="rgba(255,255,255,0.07)",tc="#B0C8E0";
                    if(qState.selected!==null){
                      if(i===qState.ok){bg="rgba(52,211,153,0.14)";bc="#34D399";tc="#5FFABB";}
                      else if(i===qState.selected){bg="rgba(255,87,87,0.14)";bc="#FF5757";tc="#FF9090";}
                    }
                    const badge=qState.selected!==null?(i===qState.ok?"✓":i===qState.selected?"✗":String.fromCharCode(65+i)):String.fromCharCode(65+i);
                    return(
                      <button key={i} onClick={()=>handleAnswer(i)}
                        style={{background:bg,border:`1.5px solid ${bc}`,borderRadius:10,padding:"12px 14px",textAlign:"left",cursor:qState.selected!==null?"default":"pointer",color:tc,fontSize:13,lineHeight:1.55,display:"flex",alignItems:"center",gap:10,outline:"none",transition:"all 0.2s"}}>
                        <span style={{minWidth:24,height:24,borderRadius:"50%",background:"rgba(255,255,255,0.05)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:"#4A6A8A",flexShrink:0}}>
                          {badge}
                        </span>
                        {opt}
                      </button>
                    );
                  })}
                </div>
                {qState.selected!==null && (
                  <div style={{marginTop:14,padding:"12px 16px",borderRadius:10,width:"100%",textAlign:"center",background:qState.feedback?"rgba(52,211,153,0.08)":"rgba(255,87,87,0.08)",border:`1px solid ${qState.feedback?"#34D39940":"#FF575740"}`}}>
                    <div style={{fontWeight:900,fontSize:16,color:qState.feedback?"#34D399":"#FF5757"}}>
                      {qState.feedback?"🎉 BETUL! +200 mata + 🛡️ Perisai!":"❌ SALAH! -1 ❤️"}
                    </div>
                    <div style={{color:"#3A5A7A",fontSize:12,marginTop:5}}>Sambung dalam sebentar...</div>
                  </div>
                )}
              </div>
            )}
          </div>
          <p style={{color:"#3A5A7A",fontSize:12,marginTop:10}}>
            Ketik <b style={{color:"#00C8AA"}}>kiri / kanan</b> untuk tukar lorong &nbsp;·&nbsp; Arrow keys juga boleh
          </p>
        </div>
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
